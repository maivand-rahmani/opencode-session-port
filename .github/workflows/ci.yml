# SessionPort CI-01 — PR/push verification workflow.
#
# Scope and safety properties (docs/V2/ROADMAP.md CI-01, docs/V2/DEPLOYMENT.md §2):
# - Windows-hosted baseline on the windows-2022 image (consistent with the
#   recorded runner termination/quoting evidence).
# - `contents: read` only; no secrets; no publishing; `pull_request` (never
#   `pull_request_target`), so fork PRs receive a read-only token and no secrets.
# - Third-party actions pinned to verified full commit SHAs (tag in comment).
# - Runner toolchains pinned exactly: Bun 1.3.10, Node 22.14.0, npm 11.5.1
#   (the verifier's npm consumer installs need an exact npm; Node 22.14.0 ships
#   an older bundled npm, so npm is pinned explicitly).
# - The focused sequence runs once, in order:
#     bun install --frozen-lockfile -> bun run typecheck -> bun test
#     -> bun run verify:package --install --keep
# - No standalone build step: `prepack` (`build:tui`) and the package tests
#   already rebuild `dist` — the existing overlap is documented, not multiplied.
# - Only the verifier's tarball and evidence.json are uploaded (consumer trees
#   are never uploaded), also on failure for diagnostics, with bounded retention.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun (exact 1.3.10)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node (exact 22.14.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0

      - name: Install exact npm (11.5.1)
        run: npm install --global npm@11.5.1

      - name: Assert pinned toolchain versions
        run: |
          $bun = (bun --version).Trim()
          $node = (node --version).Trim()
          $npm = (npm --version).Trim()
          Write-Host "bun=$bun node=$node npm=$npm"
          if ($bun -ne "1.3.10") { throw "bun version is $bun, expected 1.3.10" }
          if ($node -ne "v22.14.0") { throw "node version is $node, expected v22.14.0" }
          if ($npm -ne "11.5.1") { throw "npm version is $npm, expected 11.5.1" }

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests (full suite, once)
        run: bun test

      # No standalone build: `prepack` (`build:tui`) and the package tests
      # already rebuild `dist` — the documented overlap is not multiplied.
      - name: Verify package (tarball + bounded consumer installs)
        run: bun run verify:package --install --keep

      # Always attempted (including after an earlier-step failure) so a failed
      # run keeps its diagnostics when the verifier produced them. `--keep`
      # retains tarball/ and evidence.json under .package-verify-work/<id>/.
      - name: Upload package-verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-verify-evidence
          path: |
            .package-verify-work/*/tarball/*.tgz
            .package-verify-work/*/evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
