# SessionPort CI-02 — protected tag release workflow (fail-closed).
#
# Scope and safety properties (docs/V2/ROADMAP.md CI-02, docs/V2/DEPLOYMENT.md §2):
# - Trigger: push of a `v<version>` tag. Nothing publishes unless the owner-set
#   repository variables SESSIONPORT_RELEASE_ENABLED == "true" and
#   SESSIONPORT_RELEASE_VERSION == the exact tag/manifest version; absent or
#   mismatched variables block both jobs, and 0.1.6 is immutable and can never
#   be released again. Configure both as repository-level variables so the
#   verify job (which has no environment) can read them too.
# - verify (windows-2022, same pinned toolchain and focused sequence as ci.yml,
#   run once) produces the tarball + evidence and stages exactly one verified
#   tarball/evidence plus release metadata into `release-artifact/`, uploaded
#   under the fixed same-run artifact name (overwrite disabled = immutable).
# - publish (ubuntu-24.04, Node 22.14.0 / npm 11.5.1) runs behind the protected
#   `npm-release` environment (owner approval), downloads only the exact
#   same-run artifact by name (no run-id/repository/token overrides),
#   revalidates digest, metadata bindings, evidence, and the packed identity
#   inside the tarball, fails if the exact version already exists on npm, and
#   publishes only that downloaded exact.tgz via OIDC trusted publishing:
#   no token fallback, isolated npm config, --ignore-scripts, --provenance.
#   It never rebuilds or repacks.
# - Owner-side prerequisites, NOT guaranteed by this file: protected
#   `npm-release` environment, tag protections, and the npm trusted-publisher
#   mapping for this exact repository/workflow/environment.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun (exact 1.3.10)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node (exact 22.14.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0

      # Fail-closed gate BEFORE the expensive verification: owner variables,
      # tag/manifest version match, immutable-version block, repository identity.
      - name: Fail-closed release gate (owner vars, tag, manifest)
        env:
          SESSIONPORT_RELEASE_ENABLED: ${{ vars.SESSIONPORT_RELEASE_ENABLED }}
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
        run: node scripts/ci/release-gate.mjs

      - name: Install exact npm (11.5.1)
        run: npm install --global npm@11.5.1

      - name: Assert pinned toolchain versions
        run: |
          $bun = (bun --version).Trim()
          $node = (node --version).Trim()
          $npm = (npm --version).Trim()
          Write-Host "bun=$bun node=$node npm=$npm"
          if ($bun -ne "1.3.10") { throw "bun version is $bun, expected 1.3.10" }
          if ($node -ne "v22.14.0") { throw "node version is $node, expected v22.14.0" }
          if ($npm -ne "11.5.1") { throw "npm version is $npm, expected 11.5.1" }

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests (full suite, once)
        run: bun test

      # No standalone build: `prepack` (`build:tui`) and the package tests
      # already rebuild `dist` — the documented overlap is not multiplied.
      - name: Verify package (tarball + bounded consumer installs)
        run: bun run verify:package --install --keep

      # Selects exactly one successful install evidence + tarball from the
      # owned scratch root and stages ONLY exact.tgz / evidence.json /
      # release-metadata.json (consumer trees are never copied).
      - name: Stage exact release artifact (one verified tarball + evidence)
        run: node scripts/ci/stage-release-artifact.mjs

      # Fixed same-run artifact name; overwrite is disabled (immutable).
      - name: Upload release artifact (fixed same-run name, immutable)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verify-artifact
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm (ubuntu-24.04, owner-approved environment)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (exact 22.14.0)
        # No registry-url input: setup-node must not write an auth-token
        # template into any npm config (no token fallback is ever installed).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0

      # Fail-closed gate BEFORE publish: owner variables, tag/manifest version
      # match, immutable-version block, repository identity.
      - name: Fail-closed release gate (owner vars, tag, manifest)
        env:
          SESSIONPORT_RELEASE_ENABLED: ${{ vars.SESSIONPORT_RELEASE_ENABLED }}
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
        run: node scripts/ci/release-gate.mjs

      - name: Install exact npm (11.5.1)
        run: npm install --global npm@11.5.1

      - name: Assert pinned toolchain versions
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.5.1"

      # Downloads by exact artifact name from the current run only; no
      # run-id/repository/github-token overrides are set.
      - name: Download exact same-run artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-verify-artifact
          path: release-artifact

      - name: Validate bindings, digest, evidence, and packed identity
        run: node scripts/ci/validate-release.mjs --artifact-dir release-artifact

      - name: Fail if the exact version already exists on npm
        run: node scripts/ci/registry-check.mjs --artifact-dir release-artifact

      - name: Publish exact tarball via OIDC (no token fallback)
        working-directory: release-artifact
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.ci-npmrc-empty
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish ./exact.tgz --provenance --ignore-scripts --registry=https://registry.npmjs.org
