# SessionPort CI-02 protected release (fail-closed, dispatch-only).
#
# CI (`ci.yml`, unchanged) remains the sole build/test/package verification.
# This workflow never builds, tests, installs project dependencies, or repacks.
# It reuses exactly one already-verified CI artifact: the completed-successful
# `ci.yml` push run on `main` for the PEELED TAG COMMIT resolved from the
# GitHub API — not the current main HEAD.
#
# Resuming unpublished 0.1.7 does not move the existing tag: run this workflow
# from `main` with the single `tag` input (`v0.1.7`). The trusted workflow code
# is the current `main`; the artifact source commit is the tag commit and is
# recorded separately. Tag pushes are rejected by the gate.
#
# Owner-side prerequisites (protected `npm-release` environment, tag
# protection, npm trusted-publisher mapping) are not inferred by this file.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to resume (v<version>); resolved independently from the GitHub API
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified artifact to npm (ubuntu-24.04, owner-approved environment)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Trusted workflow code for the manual resume is the current `main`.
      - name: Checkout trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node (exact 22.14.0)
        # No registry-url input: setup-node must not write an auth-token
        # template into any npm config (no token fallback is ever installed).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0

      # Dispatch-only gate: refs/heads/main, exactly one tag input, owner vars,
      # immutable-version block, repository identity. The checkout's package.json
      # version is deliberately NOT compared here (main may have advanced).
      - name: Fail-closed release gate (main dispatch, owner vars, tag shape)
        env:
          SESSIONPORT_RELEASE_ENABLED: ${{ vars.SESSIONPORT_RELEASE_ENABLED }}
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
          SESSIONPORT_RELEASE_DISPATCH_TAG: ${{ inputs.tag }}
        run: node scripts/ci/release-gate.mjs

      - name: Install exact npm (11.5.1)
        run: npm install --global npm@11.5.1

      - name: Assert pinned Node/npm versions
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.5.1"

      # Independently peel the tag, select exactly one successful ci.yml push
      # run on main for that commit in this repository, and exactly one
      # unexpired package-verify-evidence artifact (ID + API digest).
      - name: Resolve verified CI source artifact
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SESSIONPORT_RELEASE_ENABLED: ${{ vars.SESSIONPORT_RELEASE_ENABLED }}
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
          SESSIONPORT_RELEASE_DISPATCH_TAG: ${{ inputs.tag }}
        run: node scripts/ci/resolve-ci-artifact.mjs

      # ARTIFACT_IDS (plural for download-artifact v8), exact run-id, fixed
      # repository and automatic token. merge-multiple keeps the nested verifier
      # layout; staging below understands that layout.
      - name: Download exact verified artifact by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.resolve.outputs.source-artifact-id }}
          run-id: ${{ steps.resolve.outputs.source-run-id }}
          repository: maivand-rahmani/opencode-session-port
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-downloaded

      # Stage the ACTUAL downloaded CI layout: nested verifier evidence + tarball
      # whose legacy evidence path is a Windows absolute path that is never
      # opened; only basename + digest bind it. Writes the exact three-file
      # release contract for the strong validator.
      - name: Stage downloaded artifact (safe walk, digest-bound)
        env:
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
        run: node scripts/ci/stage-release-artifact.mjs --downloaded release-downloaded --out release-artifact --resolution release-resolution/resolved-source.json

      # Re-peel the tag immediately before publish: the tag must still resolve
      # to the recorded artifact source commit, or the release aborts.
      - name: Re-verify tag commit immediately before publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/resolve-ci-artifact.mjs --recheck

      - name: Validate source proof, digest, evidence, and packed identity
        env:
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
        run: node scripts/ci/validate-release.mjs --artifact-dir release-artifact --resolution release-resolution/resolved-source.json

      - name: Fail if the exact version already exists on npm
        env:
          SESSIONPORT_RELEASE_VERSION: ${{ vars.SESSIONPORT_RELEASE_VERSION }}
          SESSIONPORT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/ci/registry-check.mjs --artifact-dir release-artifact

      - name: Publish exact tarball via OIDC (no token fallback)
        working-directory: release-artifact
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.ci-npmrc-empty
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish ./exact.tgz --provenance --ignore-scripts --registry=https://registry.npmjs.org
